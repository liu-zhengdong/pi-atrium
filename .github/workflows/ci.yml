name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix adapter
      - uses: browser-actions/setup-chrome@v2
      - name: Verify Chrome browser regression prerequisite
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            echo "::error::Chrome is required for the MCP App CSP browser regression on Linux CI"
            exit 1
          fi
      - name: Build interactive visualizer example
        run: |
          npm install --prefix adapter/examples/interactive-visualizer --no-package-lock --no-audit --no-fund
          npm run --prefix adapter/examples/interactive-visualizer build
      - run: npm run validate
      - run: git diff --exit-code dist/
      - run: npm install --global @earendil-works/pi-coding-agent@^0.84.3
      - run: npm run smoke
